<div class="header">
    <h1>Sven // <img src="assets/icons/logo-white-no-bg.svg" alt="Logo"></h1>
    <div class="container">
        <button [class.active]="isHomePage" (click)="router.navigate([getLang()])">{{ fr() ? 'ACCUEIL' : 'HOME' }}</button>
        <button [class.active]="isAboutPage" (click)="router.navigate([getLang(), 'about'])">{{ fr() ? 'À PROPOS' : 'ABOUT' }}</button>
        <button [class.active]="isContactPage" (click)="router.navigate([getLang(), 'contact'])">{{ fr() ? 'CONTACT' : 'CONTACT' }}</button>
        <select (change)="onLanguageChange($event)">
            <option value="en" [selected]="getLang() === 'en'">EN</option>
            <option value="fr" [selected]="getLang() === 'fr'">FR</option>
        </select>
    </div>
</div>
